name: Atualizar Analytics do Perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar card único (PT-BR / Roxo)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CarlosSchefferr
          filename: assets/metrics-ptbr-purple.svg

          # Visual
          template: classic
          color_mode: dark
          palette: purple
          config_display: large
          config_timezone: America/Sao_Paulo
          config_padding: 12, 12

          # Conteúdo principal
          base: header, activity, community, repositories, metadata

          # Linguagens no mesmo card
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%

      - name: Commit automático
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizar analytics do perfil"
          file_pattern: assets/metrics-ptbr-purple.svg
